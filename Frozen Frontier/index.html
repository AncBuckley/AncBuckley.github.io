<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#06111f">
    <title>Frozen Frontier</title>
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="game-shell" aria-label="Frozen Frontier survival camp game">
      <canvas id="gameCanvas" aria-label="Full screen survival camp play area"></canvas>

      <section class="hud top-hud" aria-label="Camp status">
        <button id="actionsToggle" class="main-menu-button actions-toggle" type="button" aria-expanded="false">Menu</button>
        <button id="playerIconButton" class="player-icon-button" type="button" aria-label="Player menu">
          <img id="playerIconImage" alt="">
          <span id="playerLevelBadge" class="player-level-badge">Lv 1</span>
        </button>

        <button id="furnaceMeterCard" class="meter-card meter-button" type="button" aria-label="Open generator menu">
          <span>Generator</span>
          <strong id="furnaceFuelText">50%</strong>
          <div class="meter"><i id="furnaceFuelMeter"></i></div>
          <em id="generatorAlert" class="meter-alert hidden"></em>
        </button>

        <button id="cabinHungerCard" class="meter-card meter-button" type="button" aria-label="Open Kitchen Hall menu">
          <span>Cabin Hunger</span>
          <strong id="cabinHungerText">50%</strong>
          <div class="meter food"><i id="cabinHungerMeter"></i></div>
          <em id="hungerAlert" class="meter-alert hidden"></em>
        </button>

        <section class="quick-stats" aria-label="Camp resources">
          <div class="quick-chip"><span class="resource-icon wood-icon"></span><strong id="quickWoodText">0</strong></div>
          <div class="quick-chip"><span class="resource-icon meal-icon"></span><strong id="quickDiningMealText">0</strong></div>
          <div id="quickVisitorChip" class="quick-chip city-chip hidden"><span class="resource-icon visitor-icon"></span><strong id="quickVisitorText">0</strong></div>
          <div id="quickResidentChip" class="quick-chip city-chip hidden"><span class="resource-icon resident-count-icon"></span><strong id="quickResidentText">0</strong></div>
        </section>

        <section class="cycle-hud" aria-label="Day and night cycle">
          <div class="cycle-clock" aria-hidden="true">
            <span class="clock-phase clock-phase-day">Day</span>
            <span class="clock-phase clock-phase-night">Night</span>
            <span class="clock-face"></span>
            <span class="clock-gear gear-a"></span>
            <span class="clock-gear gear-b"></span>
            <i id="cycleFill" class="clock-hand"></i>
          </div>
          <span id="cycleText" class="cycle-label">Day 1</span>
        </section>

        <section class="zoom-tools" aria-label="Zoom controls">
          <button id="zoomOutButton" type="button" aria-label="Zoom out">-</button>
          <button id="zoomResetButton" type="button" aria-label="Reset zoom">1x</button>
          <button id="zoomInButton" type="button" aria-label="Zoom in">+</button>
        </section>

        <section class="hint-hud" aria-live="polite">
          <p id="eventLog">Gather wood and food to keep the camp alive.</p>
        </section>
      </section>

      <section id="buildTray" class="hud build-tray collapsed" aria-label="Build menu">
        <div class="build-tray-controls">
          <button id="buildTrayToggle" class="build-tray-toggle" type="button" aria-expanded="false">Build</button>
        </div>
        <div class="build-tray-scroller">
          <button id="buildScrollLeft" class="build-scroll-button" type="button" aria-label="Scroll build menu left">&lt;</button>
          <div id="buildTrayBody" class="build-tray-body"></div>
          <button id="buildScrollRight" class="build-scroll-button" type="button" aria-label="Scroll build menu right">&gt;</button>
        </div>
      </section>

      <section id="centerToast" class="center-toast hidden" aria-live="polite"></section>
      <section id="pauseBadge" class="pause-badge hidden" aria-live="polite">Paused</section>

      <section id="notificationStack" class="notification-stack" aria-live="polite"></section>

      <section id="pauseLayer" class="pause-layer hidden" aria-label="Game paused">
        <article class="pause-card">
          <h2>Paused</h2>
          <p>The storm waits while you plan the next move.</p>
          <div class="modal-actions">
            <button id="resumeFromPause" class="primary" type="button">Resume</button>
            <button id="pauseMainMenu" type="button">Main Menu</button>
          </div>
        </article>
      </section>

      <div id="modalLayer" class="modal-layer hidden" role="dialog" aria-modal="true">
        <article class="modal-card">
          <button id="closeModal" class="icon-button" type="button" aria-label="Close menu">x</button>
          <p id="modalEyebrow" class="eyebrow">Camp</p>
          <h2 id="modalTitle">Building</h2>
          <div id="modalBody"></div>
        </article>
      </div>
    </main>

    <script src="game.js"></script>
  </body>
</html>
